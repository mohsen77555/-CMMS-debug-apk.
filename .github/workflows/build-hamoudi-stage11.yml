name: Build Hamoudi Stage 11 APK

on:
  push:
    branches:
      - hamoudi-full-build
    paths:
      - ".hamoudi-stage11-trigger/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build polished Hamoudi Stage 11
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct application and apply Stage 10 and 11
        id: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage11-source.log) 2>&1
          mkdir -p app
          cat \
            .hamoudi-full-source/part-00.b64 \
            .hamoudi-full-source/part-01.b64 \
            .hamoudi-full-source/part-02.b64 \
            .hamoudi-full-source/part-030.b64 \
            .hamoudi-full-source/part-031.b64 \
            .hamoudi-full-source/part-04.b64 \
            | base64 --decode > /tmp/hamoudi-full.tar.xz
          echo "26adc13b69d441a3eed6205b6ef9e1a72c4f621b4982e2c84d377c38dd5f1935  /tmp/hamoudi-full.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hamoudi-full.tar.xz -C app

          cat .hamoudi-stage09-patch/script-part-*.txt > /tmp/apply_stage09.py
          echo "f16450519656b898d7a64139dc2375a15440baae3bba090a88da100c728e0150  /tmp/apply_stage09.py" | sha256sum -c -
          python3 /tmp/apply_stage09.py app

          mkdir -p app/assets/icon
          base64 --decode .hamoudi-stage09-icon/icon.b64 > app/assets/icon/hamoodi_icon.jpg
          echo "1280133c60acce188712d202db7b3d671d5cc33fadac2cbf3d5799e5053c2e4a  app/assets/icon/hamoodi_icon.jpg" | sha256sum -c -

          cp -a .hamoudi-stage10-source/lib/. app/lib/
          cp -a .hamoudi-stage11-source/lib/. app/lib/
          sed -i 's/^version:.*/version: 2.0.0+11/' app/pubspec.yaml
          sed -i 's/(wins \/ 30)\.clamp(0\.0, 1\.0)/(wins \/ 30).clamp(0.0, 1.0).toDouble()/' app/lib/screens/games_hub_screen.dart
          rm -f app/test/widget_test.dart
          grep -n '^version:' app/pubspec.yaml

      - name: Generate Stage 10 child sounds
        id: sounds
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage11-sounds.log) 2>&1
          mkdir -p app/assets/audio
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          RATE = 22050
          OUT = Path('app/assets/audio')

          def save(name, duration, sample):
              frames = bytearray()
              count = int(RATE * duration)
              for i in range(count):
                  t = i / RATE
                  value = max(-1.0, min(1.0, sample(t, duration)))
                  frames.extend(struct.pack('<h', int(value * 21000)))
              with wave.open(str(OUT / name), 'wb') as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(RATE)
                  wav.writeframes(frames)

          def env(t, d):
              return min(1.0, t / 0.02) * max(0.0, min(1.0, (d - t) / 0.08))

          save('cat.wav', 0.72, lambda t, d: env(t, d) * 0.55 * math.sin(2*math.pi*(620 + 480*t/d)*t) * (0.75 + 0.25*math.sin(2*math.pi*7*t)))
          save('dog.wav', 0.48, lambda t, d: env(t, d) * 0.62 * math.sin(2*math.pi*(180 + 45*math.sin(2*math.pi*5*t))*t))
          save('bird.wav', 0.60, lambda t, d: env(t, d) * 0.48 * math.sin(2*math.pi*(1500 + 700*math.sin(2*math.pi*5*t))*t))
          save('train.wav', 0.80, lambda t, d: env(t, d) * (0.34*math.sin(2*math.pi*210*t) + 0.24*math.sin(2*math.pi*315*t)) * (0.6 + 0.4*math.sin(2*math.pi*3*t)))
          save('drum.wav', 0.55, lambda t, d: math.exp(-8*t) * (0.70*math.sin(2*math.pi*(105-45*t)*t) + 0.12*random.uniform(-1,1)))
          save('laugh.wav', 0.72, lambda t, d: env(t, d) * 0.45 * math.sin(2*math.pi*(360 + 60*math.sin(2*math.pi*8*t))*t) * (0.35 + 0.65*max(0, math.sin(2*math.pi*5*t))))
          save('magic.wav', 0.78, lambda t, d: env(t, d) * 0.38 * sum(math.sin(2*math.pi*f*t) for f in (660, 880, 1100)) / 3 * (0.4 + 0.6*t/d))
          PY

      - name: Set up Flutter 3.44.8
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Create platforms and install dependencies
        id: dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage11-dependencies.log) 2>&1
          flutter create --no-pub --platforms=android,ios --org com.alhadi --project-name hamoodi .
          rm -f test/widget_test.dart
          sed -i 's/^  share_plus: .*/  share_plus: 12.0.2/' pubspec.yaml
          sed -i 's/^  file_picker: .*/  file_picker: 10.3.10/' pubspec.yaml
          flutter pub get

      - name: Apply compatibility fixes and launcher icon
        id: compatibility
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/stage11-compatibility.log) 2>&1
          python3 ../.hamoudi-stage09-patch/patch_jni.py
          python3 tool/prepare_platforms.py
          sed -i 's/textDirection: TextDirection\.rtl/textDirection: ui.TextDirection.rtl/' lib/services/memory_book_service.dart
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            sed -i 's/FilePicker\.pickFiles/FilePicker.platform.pickFiles/g' "$file"
          done < <(grep -RIl 'FilePicker\.pickFiles' lib || true)
          dart run flutter_launcher_icons

      - name: Analyze Stage 11 source
        id: analyze
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter analyze lib --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/stage11-analyze.log

      - name: Build Stage 11 release APK
        id: apk
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/stage11-build.log

      - name: Publish Stage 11 APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-release.apk Hamoudi-Stage11-v2.0.0-build11.apk
          sha256sum Hamoudi-Stage11-v2.0.0-build11.apk > Hamoudi-Stage11-v2.0.0-build11.sha256
          if gh release view hamoudi-stage11-latest >/dev/null 2>&1; then
            gh release upload hamoudi-stage11-latest Hamoudi-Stage11-v2.0.0-build11.apk Hamoudi-Stage11-v2.0.0-build11.sha256 --clobber
          else
            gh release create hamoudi-stage11-latest Hamoudi-Stage11-v2.0.0-build11.apk Hamoudi-Stage11-v2.0.0-build11.sha256 \
              --title "Hamoudi Stage 11 — Drawing, Shape Sorting and Parent Progress" \
              --notes "Redesigned home with real learning progress and daily mission, parent progress dashboard, child drawing board, drag-and-drop shape sorter, and all Stage 10 games, rewards, sounds, memories and security features." \
              --prerelease --target "${GITHUB_SHA}"
          fi
          ls -lh Hamoudi-Stage11-v2.0.0-build11.apk | tee /tmp/stage11-release.log

      - name: Record Stage 11 build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SOURCE: ${{ steps.source.outcome }}
          SOUNDS: ${{ steps.sounds.outcome }}
          FLUTTER: ${{ steps.flutter.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          APK: ${{ steps.apk.outcome }}
          RELEASE: ${{ steps.release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=${JOB_STATUS}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "source=${SOURCE}"
            echo "sounds=${SOUNDS}"
            echo "flutter=${FLUTTER}"
            echo "dependencies=${DEPENDENCIES}"
            echo "compatibility=${COMPATIBILITY}"
            echo "analyze=${ANALYZE}"
            echo "apk=${APK}"
            echo "release=${RELEASE}"
            echo
            for file in /tmp/stage11-*.log; do
              if [ -f "$file" ]; then
                echo "===== $(basename "$file") ====="
                tail -n 180 "$file"
                echo
              fi
            done
          } > /tmp/stage11-latest.txt
          target=".build-status/stage11-latest.txt"
          encoded=$(base64 -w 0 /tmp/stage11-latest.txt)
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${target}?ref=hamoudi-full-build" --jq '.sha' 2>/dev/null || true)
          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target}" -f message="Update Stage 11 build result [skip ci]" -f content="$encoded" -f sha="$current_sha" -f branch="hamoudi-full-build"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target}" -f message="Record Stage 11 build result [skip ci]" -f content="$encoded" -f branch="hamoudi-full-build"
          fi
