name: Build Full Hamoudi APK

on:
  pull_request:
    paths:
      - ".hamoudi-full-source/**"
      - ".hamoudi-full-trigger/**"

permissions:
  contents: write

jobs:
  build:
    name: Build complete Hamoudi app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat \
            .hamoudi-full-source/part-00.b64 \
            .hamoudi-full-source/part-01.b64 \
            .hamoudi-full-source/part-02.b64 \
            .hamoudi-full-source/part-030.b64 \
            .hamoudi-full-source/part-031.b64 \
            .hamoudi-full-source/part-04.b64 \
            | base64 --decode > /tmp/hamoudi-full.tar.xz
          echo "26adc13b69d441a3eed6205b6ef9e1a72c4f621b4982e2c84d377c38dd5f1935  /tmp/hamoudi-full.tar.xz" | sha256sum -c -
          xz -t /tmp/hamoudi-full.tar.xz
          tar -xJf /tmp/hamoudi-full.tar.xz -C app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          find app/lib -type f | sort

      - name: Generate app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/assets/icon
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          w = h = 1024
          navy = bytes((17, 27, 46))
          gold = bytes((212, 175, 55))
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  border = x < 72 or y < 72 or x >= w - 72 or y >= h - 72
                  face = (x - 512) ** 2 + (y - 430) ** 2 < 205 ** 2
                  glasses = 310 < y < 430 and 245 < x < 779
                  suit = y > 610 and abs(x - 512) < (y - 500)
                  row.extend(gold if border or face else navy if glasses or suit else bytes((244, 237, 218)))
              rows.append(b'\x00' + bytes(row))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b'')
          Path('app/assets/icon/hamoodi_icon.png').write_bytes(png)
          PY

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Create Android and iOS platform files
        working-directory: app
        run: flutter create --no-pub --platforms=android,ios --org com.alhadi --project-name hamoodi .

      - name: Install Flutter dependencies
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          sed -i 's/^  share_plus: .*/  share_plus: 12.0.2/' pubspec.yaml
          flutter pub get 2>&1 | tee /tmp/hamoudi-pub-get.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 /tmp/hamoudi-pub-get.log)
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/.build-status/pub-get-${GITHUB_RUN_ID}.log" \
              -f message="Record Hamoudi dependency error [skip ci]" \
              -f content="$encoded" \
              -f branch="main"
            exit "$status"
          fi

      - name: Apply platform configuration
        working-directory: app
        run: python3 tool/prepare_platforms.py

      - name: Generate launcher icons
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Analyze source
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Build full release APK
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee /tmp/hamoudi-apk-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(base64 -w 0 /tmp/hamoudi-apk-build.log)
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/.build-status/apk-build-${GITHUB_RUN_ID}.log" \
              -f message="Record Hamoudi APK build error [skip ci]" \
              -f content="$encoded" \
              -f branch="main"
            exit "$status"
          fi

      - name: Prepare full APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-release.apk Hamoudi-Full-v1.7.0-build8.apk
          sha256sum Hamoudi-Full-v1.7.0-build8.apk > Hamoudi-Full-v1.7.0-build8.sha256
          ls -lh Hamoudi-Full-v1.7.0-build8.apk

      - name: Publish full APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view hamoudi-full-latest >/dev/null 2>&1; then
            gh release upload hamoudi-full-latest Hamoudi-Full-v1.7.0-build8.apk Hamoudi-Full-v1.7.0-build8.sha256 --clobber
          else
            gh release create hamoudi-full-latest Hamoudi-Full-v1.7.0-build8.apk Hamoudi-Full-v1.7.0-build8.sha256 --title "Hamoudi Full 1.7.0+8" --notes "Complete Hamoudi Android application with all implemented stages." --prerelease --target "${GITHUB_SHA}"
          fi
