name: Verify and Release Hamoudi Stage 11

on:
  pull_request:
    branches:
      - main
    paths:
      - ".hamoudi-stage11-pr-trigger/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat \
            .hamoudi-full-source/part-00.b64 \
            .hamoudi-full-source/part-01.b64 \
            .hamoudi-full-source/part-02.b64 \
            .hamoudi-full-source/part-030.b64 \
            .hamoudi-full-source/part-031.b64 \
            .hamoudi-full-source/part-04.b64 \
            | base64 --decode > /tmp/hamoudi-full.tar.xz
          echo "26adc13b69d441a3eed6205b6ef9e1a72c4f621b4982e2c84d377c38dd5f1935  /tmp/hamoudi-full.tar.xz" | sha256sum -c -
          tar -xJf /tmp/hamoudi-full.tar.xz -C app

          cat .hamoudi-stage09-patch/script-part-*.txt > /tmp/apply_stage09.py
          echo "f16450519656b898d7a64139dc2375a15440baae3bba090a88da100c728e0150  /tmp/apply_stage09.py" | sha256sum -c -
          python3 /tmp/apply_stage09.py app

          mkdir -p app/assets/icon
          base64 --decode .hamoudi-stage09-icon/icon.b64 > app/assets/icon/hamoodi_icon.jpg
          cp -a .hamoudi-stage10-source/lib/. app/lib/
          cp -a .hamoudi-stage11-source/lib/. app/lib/
          sed -i 's/^version:.*/version: 2.0.0+11/' app/pubspec.yaml
          sed -i 's/(wins \/ 30)\.clamp(0\.0, 1\.0)/(wins \/ 30).clamp(0.0, 1.0).toDouble()/' app/lib/screens/games_hub_screen.dart
          rm -f app/test/widget_test.dart

      - name: Generate additional child sounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/assets/audio
          python3 - <<'PY'
          import math
          import random
          import struct
          import wave
          from pathlib import Path

          rate = 22050
          output = Path('app/assets/audio')

          def save(name, duration, sample):
              frames = bytearray()
              for i in range(int(rate * duration)):
                  t = i / rate
                  value = max(-1.0, min(1.0, sample(t, duration)))
                  frames.extend(struct.pack('<h', int(value * 21000)))
              with wave.open(str(output / name), 'wb') as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  wav.writeframes(frames)

          def env(t, d):
              return min(1.0, t / 0.02) * max(0.0, min(1.0, (d - t) / 0.08))

          save('cat.wav', 0.72, lambda t, d: env(t, d) * 0.55 * math.sin(2*math.pi*(620 + 480*t/d)*t) * (0.75 + 0.25*math.sin(2*math.pi*7*t)))
          save('dog.wav', 0.48, lambda t, d: env(t, d) * 0.62 * math.sin(2*math.pi*(180 + 45*math.sin(2*math.pi*5*t))*t))
          save('bird.wav', 0.60, lambda t, d: env(t, d) * 0.48 * math.sin(2*math.pi*(1500 + 700*math.sin(2*math.pi*5*t))*t))
          save('train.wav', 0.80, lambda t, d: env(t, d) * (0.34*math.sin(2*math.pi*210*t) + 0.24*math.sin(2*math.pi*315*t)) * (0.6 + 0.4*math.sin(2*math.pi*3*t)))
          save('drum.wav', 0.55, lambda t, d: math.exp(-8*t) * (0.70*math.sin(2*math.pi*(105-45*t)*t) + 0.12*random.uniform(-1,1)))
          save('laugh.wav', 0.72, lambda t, d: env(t, d) * 0.45 * math.sin(2*math.pi*(360 + 60*math.sin(2*math.pi*8*t))*t) * (0.35 + 0.65*max(0, math.sin(2*math.pi*5*t))))
          save('magic.wav', 0.78, lambda t, d: env(t, d) * 0.38 * sum(math.sin(2*math.pi*f*t) for f in (660, 880, 1100)) / 3 * (0.4 + 0.6*t/d))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android,ios --org com.alhadi --project-name hamoodi .
          rm -f test/widget_test.dart
          sed -i 's/^  share_plus: .*/  share_plus: 12.0.2/' pubspec.yaml
          sed -i 's/^  file_picker: .*/  file_picker: 10.3.10/' pubspec.yaml
          flutter pub get

      - name: Prepare Android and iOS
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 ../.hamoudi-stage09-patch/patch_jni.py
          python3 tool/prepare_platforms.py
          sed -i 's/textDirection: TextDirection\.rtl/textDirection: ui.TextDirection.rtl/' lib/services/memory_book_service.dart
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            sed -i 's/FilePicker\.pickFiles/FilePicker.platform.pickFiles/g' "$file"
          done < <(grep -RIl 'FilePicker\.pickFiles' lib || true)
          dart run flutter_launcher_icons

      - name: Analyze source
        working-directory: app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-release.apk Hamoudi-Stage11-v2.0.0-build11.apk
          sha256sum Hamoudi-Stage11-v2.0.0-build11.apk > Hamoudi-Stage11-v2.0.0-build11.sha256
          if gh release view hamoudi-stage11-latest >/dev/null 2>&1; then
            gh release upload hamoudi-stage11-latest Hamoudi-Stage11-v2.0.0-build11.apk Hamoudi-Stage11-v2.0.0-build11.sha256 --clobber
          else
            gh release create hamoudi-stage11-latest Hamoudi-Stage11-v2.0.0-build11.apk Hamoudi-Stage11-v2.0.0-build11.sha256 \
              --title "Hamoudi Stage 11 — Drawing and Parent Progress" \
              --notes "Improved home, daily mission, parent progress dashboard, drawing board, shape sorting, learning rewards, expanded games and sounds." \
              --prerelease --target "${GITHUB_SHA}"
          fi
