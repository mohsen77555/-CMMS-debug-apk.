name: Inspect Hamoudi Stage 09 source

on:
  push:
    branches:
      - hamoudi-full-build
    paths:
      - ".hamoudi-inspect-trigger/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Stage 09 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat \
            .hamoudi-full-source/part-00.b64 \
            .hamoudi-full-source/part-01.b64 \
            .hamoudi-full-source/part-02.b64 \
            .hamoudi-full-source/part-030.b64 \
            .hamoudi-full-source/part-031.b64 \
            .hamoudi-full-source/part-04.b64 \
            | base64 --decode > /tmp/hamoudi-full.tar.xz
          tar -xJf /tmp/hamoudi-full.tar.xz -C app
          cat .hamoudi-stage09-patch/script-part-*.txt > /tmp/apply_stage09.py
          python3 /tmp/apply_stage09.py app

      - name: Export source map and key source files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "===== FILES ====="
            find app/lib -type f | sort
            echo
            echo "===== ROUTES AND CLASSES ====="
            grep -R -nE "class .*Screen|routes:|GoRoute|Navigator|onGenerateRoute" app/lib | head -n 500 || true
          } > /tmp/source-map.txt

          publish_file() {
            local source="$1"
            local target="$2"
            test -f "$source" || return 0
            local encoded
            local current_sha
            encoded=$(base64 -w 0 "$source")
            current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${target}?ref=hamoudi-full-build" --jq '.sha' 2>/dev/null || true)
            if [ -n "$current_sha" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target}" \
                -f message="Update Stage 09 source export [skip ci]" \
                -f content="$encoded" -f sha="$current_sha" -f branch="hamoudi-full-build"
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${target}" \
                -f message="Add Stage 09 source export [skip ci]" \
                -f content="$encoded" -f branch="hamoudi-full-build"
            fi
          }

          publish_file /tmp/source-map.txt .hamoudi-stage09-source/source-map.txt
          publish_file app/pubspec.yaml .hamoudi-stage09-source/pubspec.yaml
          publish_file app/lib/main.dart .hamoudi-stage09-source/lib/main.dart
          publish_file app/lib/theme/app_theme.dart .hamoudi-stage09-source/lib/theme/app_theme.dart
          publish_file app/lib/screens/main_shell.dart .hamoudi-stage09-source/lib/screens/main_shell.dart
          publish_file app/lib/screens/home_screen.dart .hamoudi-stage09-source/lib/screens/home_screen.dart
          publish_file app/lib/screens/games_hub_screen.dart .hamoudi-stage09-source/lib/screens/games_hub_screen.dart
          publish_file app/lib/screens/learning_cards_game_screen.dart .hamoudi-stage09-source/lib/screens/learning_cards_game_screen.dart
          publish_file app/lib/screens/bubble_game_screen.dart .hamoudi-stage09-source/lib/screens/bubble_game_screen.dart
          publish_file app/lib/screens/colors_shapes_screen.dart .hamoudi-stage09-source/lib/screens/colors_shapes_screen.dart
          publish_file app/lib/screens/sound_playground_screen.dart .hamoudi-stage09-source/lib/screens/sound_playground_screen.dart
          publish_file app/lib/screens/memories_screen.dart .hamoudi-stage09-source/lib/screens/memories_screen.dart
          publish_file app/lib/screens/on_this_day_screen.dart .hamoudi-stage09-source/lib/screens/on_this_day_screen.dart
          publish_file app/lib/screens/favorites_screen.dart .hamoudi-stage09-source/lib/screens/favorites_screen.dart
          publish_file app/lib/screens/more_screen.dart .hamoudi-stage09-source/lib/screens/more_screen.dart
          publish_file app/lib/services/kid_audio_service.dart .hamoudi-stage09-source/lib/services/kid_audio_service.dart
